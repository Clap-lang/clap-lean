name = "clap"
version = "0.1.0"
defaultTargets = ["Clap"]

[[lean_lib]]
name = "Clap"
leanOptions = [
  { name = "linter.unusedVariables", value = true },
  { name = "autoImplicit", value = false },
]

[[lean_exe]]
name = "Milestone"
root = "Clap.Milestone"
leanOptions = [
  { name = "maxRecDepth", value = 100000 },
]

[[lean_lib]]
name = "R1Serialize"
leanOptions = [
  { name = "linter.unusedVariables", value = true },
  { name = "autoImplicit", value = false },
]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.27.0"
